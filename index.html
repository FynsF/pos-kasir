<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>POS Kasir</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <!-- HEADER -->

      <header class="header">
        <div>
          <h1>POS KASIR</h1>

          <p id="status">Siap transaksi</p>
        </div>

        <button onclick="bukaCustomer()" class="btn customer-btn">
          DISPLAY PEMBELI
        </button>
      </header>

      <!-- DAFTAR PRODUK -->

      <section class="produk-section">
        <h2>Daftar Produk</h2>

        <div id="produk">Memuat produk...</div>
      </section>

      <!-- KERANJANG -->

      <section class="cart-section">
        <h2>Keranjang Belanja</h2>

        <table>
          <thead>
            <tr>
              <th>Produk</th>

              <th>Harga</th>

              <th>Qty</th>

              <th>Subtotal</th>
            </tr>
          </thead>

          <tbody id="keranjang"></tbody>
        </table>
      </section>

      <!-- TOTAL -->

      <div class="total-box">
        <h2>
          TOTAL : Rp

          <span id="total"> 0 </span>
        </h2>
      </div>

      <!-- BUTTON ACTION -->

      <div class="button-area">
        <button onclick="bayar()" class="btn bayar">BAYAR QRIS</button>

        <button onclick="lunas()" class="btn lunas">SUDAH DIBAYAR</button>

        <button onclick="cetakStruk()" class="btn cetak">
          CETAK STRUK 80MM
        </button>

        <button onclick="downloadStruk()" class="btn download">
          DOWNLOAD PDF
        </button>

        <button onclick="resetTransaksi()" class="btn reset">
          TRANSAKSI BARU
        </button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
