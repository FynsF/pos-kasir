<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <title>Struk Pembayaran</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: "Courier New", monospace;
        width: 48mm;
        margin: 0 auto;
        padding: 0;
        font-size: 10px;
        color: #000;
        background: #fff;
      }

      #struk {
        width: 48mm;
        padding: 2mm;
        background: #fff;
      }

      .center {
        text-align: center;
      }

      .logo {
        width: 42px;
        height: 42px;
        object-fit: contain;
        margin-bottom: 3px;
      }

      h3 {
        margin: 2px 0;
        font-size: 12px;
      }

      p {
        margin: 1px 0;
      }

      .line {
        border-top: 1px dashed #000;
        margin: 5px 0;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      td {
        padding: 2px 0;
        vertical-align: top;
      }

      .right {
        text-align: right;
      }

      .item {
        width: 55%;
      }

      .qty {
        width: 12%;
        text-align: center;
      }

      .price {
        width: 33%;
        text-align: right;
      }

      .total {
        font-size: 11px;
        font-weight: bold;
      }

      .footer {
        text-align: center;
        font-size: 9px;
        margin-top: 6px;
      }

      button {
        width: 95%;
        margin: 10px auto;
        display: block;
        padding: 10px;
        border: none;
        border-radius: 6px;
        background: #111;
        color: #fff;
        cursor: pointer;
      }

      @media print {
        body {
          width: 48mm;
          margin: 0;
          padding: 0;
        }

        #struk {
          width: 48mm;
          padding: 2mm;
        }

        button {
          display: none;
        }

        @page {
          size: 58mm auto;
          margin: 0;
        }
      }
    </style>
  </head>

  <body>
    <div id="struk">
      <div class="center">
        <img
          src="Logo no background.png"
          class="logo"
          crossorigin="anonymous"
          onerror="this.style.display = 'none'"
        />

        <h3>FYNCOFFEE</h3>

        <p>Jl. Kesawan</p>

        <p>Telp : 081269441924</p>
      </div>

      <div class="line"></div>

      <table>
        <tr>
          <td>No Invoice</td>

          <td class="right">
            <span id="id"> - </span>
          </td>
        </tr>

        <tr>
          <td>Tanggal</td>

          <td class="right">
            <span id="tanggal"> - </span>
          </td>
        </tr>

        <tr>
          <td>Kasir</td>

          <td class="right">
            <span id="kasir"> Admin </span>
          </td>
        </tr>
      </table>

      <div class="line"></div>

      <table>
        <thead>
          <tr>
            <td class="item">Item</td>

            <td class="qty">Qty</td>

            <td class="price">Jumlah</td>
          </tr>
        </thead>

        <tbody id="detail"></tbody>
      </table>

      <div class="line"></div>

      <table>
        <tr>
          <td>Subtotal</td>

          <td class="right">Rp <span id="subtotal">0</span></td>
        </tr>

        <tr>
          <td>Diskon</td>

          <td class="right">Rp <span id="diskon">0</span></td>
        </tr>

        <tr>
          <td>Pajak</td>

          <td class="right">Rp <span id="pajak">0</span></td>
        </tr>

        <tr class="total">
          <td>TOTAL</td>

          <td class="right">Rp <span id="total">0</span></td>
        </tr>

        <tr>
          <td>Bayar</td>

          <td class="right">Rp <span id="bayar">0</span></td>
        </tr>

        <tr>
          <td>Kembali</td>

          <td class="right">Rp <span id="kembali">0</span></td>
        </tr>
      </table>

      <div class="line"></div>

      <div class="footer">
        <p>Pembayaran</p>

        <h3>QRIS</h3>

        <p>================</p>

        <p>Terima Kasih</p>

        <p>Semoga Berkah</p>

        <p>*** Barang yang sudah dibeli tidak dapat dikembalikan ***</p>
      </div>
    </div>

    <button onclick="window.print()">PRINT STRUK</button>

    <button onclick="downloadPDF()">DOWNLOAD PDF</button>

    <!-- PDF LIBRARY -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- DATA STRUK -->

    <script src="struk.js"></script>

    <script>
      async function downloadPDF() {
        try {
          const area = document.getElementById("struk");

          const canvas = await html2canvas(area, {
            scale: 3,
            useCORS: true,
            backgroundColor: "#ffffff",
          });

          const imgData = canvas.toDataURL("image/png");

          const { jsPDF } = window.jspdf;

          const lebar = 48;

          const tinggi = (canvas.height * lebar) / canvas.width;

          const pdf = new jsPDF({
            orientation: "portrait",
            unit: "mm",
            format: [58, tinggi + 4],
          });

          pdf.addImage(imgData, "PNG", 5, 2, lebar, tinggi);

          const nomor = document.getElementById("id").innerText;

          pdf.save("Struk-" + nomor + ".pdf");
        } catch (err) {
          console.error(err);

          alert("Download PDF gagal");
        }
      }
    </script>
  </body>
</html>
