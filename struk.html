<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <title>Struk Pembayaran</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: "Courier New", monospace;

        width: 80mm;

        margin: auto;

        font-size: 12px;

        color: #000;
      }

      .center {
        text-align: center;
      }

      .logo {
        width: 60px;

        height: 60px;

        object-fit: contain;

        margin-bottom: 5px;
      }

      h3 {
        margin: 5px 0;

        font-size: 16px;
      }

      p {
        margin: 3px 0;
      }

      .line {
        border-top: 1px dashed #000;

        margin: 8px 0;
      }

      table {
        width: 100%;

        border-collapse: collapse;
      }

      td {
        padding: 3px 0;

        vertical-align: top;
      }

      .nama-produk {
        width: 45%;
      }

      .qty {
        width: 10%;

        text-align: center;
      }

      .harga {
        text-align: right;
      }

      .total {
        font-size: 15px;

        font-weight: bold;
      }

      .footer {
        text-align: center;

        margin-top: 15px;
      }

      button {
        margin-top: 20px;

        width: 100%;

        padding: 10px;

        font-size: 14px;

        cursor: pointer;
      }

      @media print {
        body {
          width: 80mm;
        }

        button {
          display: none;
        }

        @page {
          size: 80mm auto;

          margin: 0;
        }
      }
    </style>
  </head>

  <body>
    <div class="center">
      <!-- Logo optional -->

      <img src="Logo no background.png" class="logo" onerror="this.style.display = 'none'" />

      <h3>FYNCOFFEE</h3>

      <p>Jl.Kesawan</p>

      <p>Telp : 081269441924</p>
    </div>

    <div class="line"></div>

    <table>
      <tr>
        <td>No Invoice</td>

        <td align="right">
          <span id="id"> - </span>
        </td>
      </tr>

      <tr>
        <td>Tanggal</td>

        <td align="right">
          <span id="tanggal"> - </span>
        </td>
      </tr>

      <tr>
        <td>Kasir</td>

        <td align="right">
          <span id="kasir"> Admin </span>
        </td>
      </tr>
    </table>

    <div class="line"></div>

    <table>
      <thead>
        <tr>
          <td>Item</td>

          <td class="qty">Qty</td>

          <td class="harga">Jumlah</td>
        </tr>
      </thead>

      <tbody id="detail"></tbody>
    </table>

    <div class="line"></div>

    <table>
      <tr>
        <td>Subtotal</td>

        <td align="right">Rp <span id="subtotal"> 0 </span></td>
      </tr>

      <tr>
        <td>Diskon</td>

        <td align="right">Rp <span id="diskon"> 0 </span></td>
      </tr>

      <tr>
        <td>Pajak</td>

        <td align="right">Rp <span id="pajak"> 0 </span></td>
      </tr>

      <tr class="total">
        <td>TOTAL</td>

        <td align="right">Rp <span id="total"> 0 </span></td>
      </tr>

      <tr>
        <td>Bayar</td>

        <td align="right">Rp <span id="bayar"> 0 </span></td>
      </tr>

      <tr>
        <td>Kembali</td>

        <td align="right">Rp <span id="kembali"> 0 </span></td>
      </tr>
    </table>

    <div class="line"></div>

    <div class="footer">
      <p>Pembayaran</p>

      <h3>QRIS</h3>

      <p>================</p>

      <p>Terima Kasih</p>

      <p>Semoga Berkah</p>

      <p>*** Barang yang sudah dibeli tidak dapat dikembalikan ***</p>
    </div>

    <button onclick="window.print()">PRINT STRUK</button>

    <button onclick="downloadPDF()">DOWNLOAD PDF</button>

    <script src="struk.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script>
      function downloadPDF() {
        const { jsPDF } = window.jspdf;

        let pdf = new jsPDF({
          orientation: "portrait",

          unit: "mm",

          format: [80, 150],
        });

        let isi = document.body.innerText;

        pdf.text(
          isi,

          5,

          10,
        );

        pdf.save("struk-pembayaran.pdf");
      }
    </script>
  </body>
</html>
