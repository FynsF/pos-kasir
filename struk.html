<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <title>Struk Pembayaran</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: "Courier New", monospace;

        width: 72mm;

        margin: 0 auto;

        padding: 0;

        font-size: 12px;

        color: #000;

        background: #fff;
      }

      #struk {
        width: 72mm;

        padding: 5mm 2mm;

        background: white;
      }

      .center {
        text-align: center;
      }

      .logo {
        width: 55px;

        height: 55px;

        object-fit: contain;

        margin-bottom: 5px;
      }

      h3 {
        margin: 3px 0;

        font-size: 16px;
      }

      p {
        margin: 2px 0;
      }

      .line {
        border-top: 1px dashed #000;

        margin: 8px 0;
      }

      table {
        width: 100%;

        border-collapse: collapse;
      }

      td {
        padding: 3px 0;

        vertical-align: top;
      }

      .right {
        text-align: right;
      }

      .item {
        width: 50%;
      }

      .qty {
        width: 10%;

        text-align: center;
      }

      .price {
        width: 40%;

        text-align: right;
      }

      .total {
        font-size: 15px;

        font-weight: bold;
      }

      .footer {
        text-align: center;

        font-size: 11px;

        margin-top: 10px;
      }

      button {
        width: 90%;

        margin: 10px auto;

        display: block;

        padding: 12px;

        border: none;

        border-radius: 8px;

        background: #111;

        color: white;

        font-size: 14px;

        cursor: pointer;
      }

      /* =====================
PRINT THERMAL 80MM
===================== */

      @media print {
        body {
          width: 72mm;

          margin: 0 auto;

          padding: 0;
        }

        #struk {
          width: 72mm;

          padding: 3mm 0;
        }

        button {
          display: none;
        }

        @page {
          size: 80mm auto;

          margin: 4mm;
        }
      }
    </style>
  </head>

  <body>
    <div id="struk">
      <div class="center">
        <img
          src="Logo no background.png"
          class="logo"
          crossorigin="anonymous"
          onerror="this.style.display = 'none'"
        />

        <h3>FYNCOFFEE</h3>

        <p>Jl. Kesawan</p>

        <p>Telp : 081269441924</p>
      </div>

      <div class="line"></div>

      <table>
        <tr>
          <td>No Invoice</td>

          <td class="right">
            <span id="id"> - </span>
          </td>
        </tr>

        <tr>
          <td>Tanggal</td>

          <td class="right">
            <span id="tanggal"> - </span>
          </td>
        </tr>

        <tr>
          <td>Kasir</td>

          <td class="right">
            <span id="kasir"> Admin </span>
          </td>
        </tr>
      </table>

      <div class="line"></div>

      <table>
        <thead>
          <tr>
            <td class="item">Item</td>

            <td class="qty">Qty</td>

            <td class="price">Jumlah</td>
          </tr>
        </thead>

        <tbody id="detail"></tbody>
      </table>

      <div class="line"></div>

      <table>
        <tr>
          <td>Subtotal</td>

          <td class="right">Rp <span id="subtotal">0</span></td>
        </tr>

        <tr>
          <td>Diskon</td>

          <td class="right">Rp <span id="diskon">0</span></td>
        </tr>

        <tr>
          <td>Pajak</td>

          <td class="right">Rp <span id="pajak">0</span></td>
        </tr>

        <tr class="total">
          <td>TOTAL</td>

          <td class="right">Rp <span id="total">0</span></td>
        </tr>

        <tr>
          <td>Bayar</td>

          <td class="right">Rp <span id="bayar">0</span></td>
        </tr>

        <tr>
          <td>Kembali</td>

          <td class="right">Rp <span id="kembali">0</span></td>
        </tr>
      </table>

      <div class="line"></div>

      <div class="footer">
        <p>Pembayaran</p>

        <h3>QRIS</h3>

        <p>================</p>

        <p>Terima Kasih</p>

        <p>Semoga Berkah</p>

        <p>*** Barang yang sudah dibeli tidak dapat dikembalikan ***</p>
      </div>
    </div>

    <button onclick="window.print()">PRINT STRUK</button>

    <button onclick="downloadPDF()">DOWNLOAD PDF</button>

    <!-- PDF LIBRARY -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- DATA STRUK -->

    <script src="struk.js"></script>

    <script>
      async function downloadPDF() {
        try {
          const area = document.getElementById("struk");

          const canvas = await html2canvas(area, {
            scale: 3,

            useCORS: true,

            allowTaint: true,

            backgroundColor: "#ffffff",
          });

          const imgData = canvas.toDataURL("image/png");

          const { jsPDF } = window.jspdf;

          let lebar = 72;

          let tinggi = (canvas.height * lebar) / canvas.width;

          const pdf = new jsPDF({
            orientation: "portrait",

            unit: "mm",

            format: [80, tinggi + 15],
          });

          pdf.addImage(
            imgData,

            "PNG",

            4,

            5,

            lebar,

            tinggi,
          );

          let nomor = document.getElementById("id").innerText;

          pdf.save("Struk-" + nomor + ".pdf");
        } catch (error) {
          console.error(error);

          alert("Download PDF gagal");
        }
      }
    </script>
  </body>
</html>
