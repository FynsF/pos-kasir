<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <title>Struk Pembayaran</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        width: 58mm;

        margin: 0;

        padding: 0;

        background: #fff;
      }

      body {
        width: 58mm;

        margin: 0 auto;

        padding: 0;

        background: #fff;

        color: #000;

        font-family: "Arial Narrow", "Courier New", monospace;

        font-size: 9px;

        -webkit-print-color-adjust: exact;

        print-color-adjust: exact;
      }

      /* =====================
   AREA STRUK PANDA TM
===================== */

      #struk {
        width: 48mm;

        margin-left: auto;

        margin-right: auto;

        padding: 3mm 0 3mm 0;
      }

      /* CENTER */

      .center {
        text-align: center;
      }

      /* LOGO */

      .logo {
        width: 40px;

        height: 40px;

        display: block;

        margin: 0 auto 4px;

        object-fit: contain;
      }

      /* HEADER */

      h3 {
        font-size: 13px;

        font-weight: bold;

        margin: 2px 0;
      }

      p {
        line-height: 1.25;

        margin: 1px 0;
      }

      /* GARIS */

      .line {
        width: 100%;

        border-top: 1px dashed #000;

        margin: 5px 0;
      }

      /* TABLE */

      table {
        width: 100%;

        border-collapse: collapse;

        table-layout: fixed;
      }

      td {
        padding: 2px 0;

        vertical-align: top;
      }

      /* ITEM */

      .item {
        width: 56%;

        word-wrap: break-word;
      }

      /* JUMLAH */

      .qty {
        width: 12%;

        text-align: center;
      }

      /* HARGA */

      .price {
        width: 32%;

        text-align: right;
      }

      .right {
        text-align: right;
      }

      /* TOTAL */

      .total td {
        font-size: 11px;

        font-weight: bold;

        padding-top: 5px;
      }

      /* FOOTER */

      .footer {
        text-align: center;

        font-size: 9px;

        margin-top: 6px;
      }

      /* BUTTON */

      button {
        width: 220px;

        display: block;

        margin: 12px auto;

        padding: 10px;

        border: none;

        border-radius: 6px;

        background: #111;

        color: white;

        cursor: pointer;

        font-size: 13px;
      }

      /* =====================
       PRINT PANDA TM
===================== */

      @media print {
        @page {
          size: 58mm auto;

          margin: 0;
        }

        html,
        body {
          width: 58mm;

          margin: 0;

          padding: 0;
        }

        #struk {
          width: 48mm;

          margin-left: auto;

          margin-right: auto;

          padding-top: 2mm;
        }

        button {
          display: none;
        }
      }

      @page {
        size: 58mm auto;

        margin: 0;
      }
    </style>
  </head>

  <body>
    <div id="struk">
      <div class="center">
        <img
          src="Logo no background.png"
          class="logo"
          crossorigin="anonymous"
          onerror="this.style.display = 'none'"
        />

        <h3>FYNCOFFEE</h3>

        <p>Jl. Kesawan</p>

        <p>Telp : 081269441924</p>
      </div>

      <div class="line"></div>

      <table>
        <tr>
          <td>No Invoice</td>

          <td class="right">
            <span id="id"> - </span>
          </td>
        </tr>

        <tr>
          <td>Tanggal</td>

          <td class="right">
            <span id="tanggal"> - </span>
          </td>
        </tr>

        <tr>
          <td>Kasir</td>

          <td class="right">
            <span id="kasir"> Admin </span>
          </td>
        </tr>
      </table>

      <div class="line"></div>

      <table>
        <thead>
          <tr>
            <td class="item">Item</td>

            <td class="qty">Qty</td>

            <td class="price">Jumlah</td>
          </tr>
        </thead>

        <tbody id="detail"></tbody>
      </table>

      <div class="line"></div>

      <table>
        <tr>
          <td>Subtotal</td>

          <td class="right">Rp <span id="subtotal">0</span></td>
        </tr>

        <tr>
          <td>Diskon</td>

          <td class="right">Rp <span id="diskon">0</span></td>
        </tr>

        <tr>
          <td>Pajak</td>

          <td class="right">Rp <span id="pajak">0</span></td>
        </tr>

        <tr class="total">
          <td>TOTAL</td>

          <td class="right">Rp <span id="total">0</span></td>
        </tr>

        <tr>
          <td>Bayar</td>

          <td class="right">Rp <span id="bayar">0</span></td>
        </tr>

        <tr>
          <td>Kembali</td>

          <td class="right">Rp <span id="kembali">0</span></td>
        </tr>
      </table>

      <div class="line"></div>

      <div class="footer">
        <p>Pembayaran QRIS</p>

        <div class="line"></div>

        <p>Terima Kasih ☕</p>

        <p>Semoga Harimu Menyenangkan</p>

        <p>Barang yang sudah dibeli</p>

        <p>tidak dapat dikembalikan.</p>
      </div>
    </div>

    <button onclick="window.print()">PRINT STRUK</button>

    <button onclick="downloadPDF()">DOWNLOAD PDF</button>

    <!-- PDF LIBRARY -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- DATA STRUK -->

    <script src="struk.js"></script>

    <script>
      async function downloadPDF() {
        try {
          const area = document.getElementById("struk");

          const canvas = await html2canvas(area, {
            scale: 4,

            backgroundColor: "#ffffff",

            useCORS: true,
          });

          const imgData = canvas.toDataURL("image/png");

          const { jsPDF } = window.jspdf;

          const width = 48;

          const height = (canvas.height * width) / canvas.width;

          const pdf = new jsPDF({
            orientation: "portrait",

            unit: "mm",

            format: [58, height + 4],
          });

          pdf.addImage(
            imgData,

            "PNG",

            5,

            2,

            width,

            height,
          );

          const nomor = document.getElementById("id").innerText;

          pdf.save("Struk-" + nomor + ".pdf");
        } catch (error) {
          console.error(error);

          alert("Download PDF gagal");
        }
      }
    </script>
  </body>
</html>
