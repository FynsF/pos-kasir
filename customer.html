<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Customer Display QRIS</title>

    <link rel="stylesheet" href="style.css" />

    <style>
      body {
        margin: 0;

        background: #111;

        font-family: Arial, sans-serif;
      }

      .customer {
        height: 100vh;

        display: flex;

        flex-direction: column;

        justify-content: center;

        align-items: center;

        text-align: center;

        color: white;

        cursor: pointer;
      }

      #judul {
        font-size: 45px;

        margin-bottom: 20px;
      }

      .total {
        font-size: 80px;

        font-weight: bold;

        margin: 20px;
      }

      .qris {
        width: 320px;

        height: 320px;

        object-fit: contain;

        background: white;

        padding: 15px;

        border-radius: 20px;
      }

      #instruksi {
        font-size: 35px;

        margin-top: 30px;
      }

      #status {
        font-size: 25px;

        opacity: 0.8;
      }

      /* ANIMASI */

      .waiting {
        animation: pulse 1.5s infinite;
      }

      @keyframes pulse {
        0% {
          opacity: 1;
        }

        50% {
          opacity: 0.5;
        }

        100% {
          opacity: 1;
        }
      }

      .success {
        animation: zoom 0.5s;
      }

      @keyframes zoom {
        from {
          transform: scale(0.5);
        }

        to {
          transform: scale(1);
        }
      }
    </style>
  </head>

  <body>
    <div class="customer waiting" onclick="fullscreen()">
      <h1 id="judul">TOTAL PEMBAYARAN</h1>

      <div class="total">
        Rp

        <span id="total"> 0 </span>
      </div>

      <img src="Qris Fyn.jpg" class="qris" />

      <h2 id="instruksi">Silahkan Scan QRIS</h2>

      <p id="status">Menunggu transaksi...</p>
    </div>

    <script>
      const API =
        "https://script.google.com/macros/s/AKfycbz-1nUJmKOjNYQEUKRwAEBt7h1D9xs3injteRNf0WjJhY6aWk0U2hpbmpYjXuKmHRih/exec?action=display";

      let transaksiSebelumnya = "";

      function cekTransaksi() {
        fetch(API)
          .then((res) => res.json())

          .then((data) => {
            console.log(data);

            // BELUM ADA TRANSAKSI

            if (data.status == "kosong") {
              resetDisplay();

              return;
            }

            // PEMBAYARAN SELESAI

            if (data.status == "Lunas") {
              tampilSukses();

              return;
            }

            // TRANSAKSI BARU

            if (data.id != transaksiSebelumnya) {
              transaksiSebelumnya = data.id;
            }

            if (data.total) {
              document.getElementById("total").innerHTML = Number(
                data.total,
              ).toLocaleString("id-ID");

              document.getElementById("instruksi").innerHTML =
                "Silahkan Scan QRIS";

              document.getElementById("status").innerHTML =
                "Menunggu Pembayaran";
            }
          })

          .catch((err) => {
            console.log(err);

            document.getElementById("status").innerHTML = "Koneksi gagal";
          });
      }

      // ========================
      // PEMBAYARAN BERHASIL
      // ========================

      function tampilSukses() {
        document.querySelector(".customer").innerHTML = `

<h1 class="success">

PEMBAYARAN BERHASIL

</h1>


<h2>

TERIMA KASIH

</h2>


<p>

Pesanan sedang diproses

</p>


`;

        setTimeout(() => {
          resetDisplay();
        }, 5000);
      }

      // ========================
      // RESET DISPLAY
      // ========================

      function resetDisplay() {
        document.querySelector(".customer").innerHTML = `

<h1 id="judul">

TOTAL PEMBAYARAN

</h1>



<div class="total">


Rp 

<span id="total">

0

</span>


</div>




<img 

src="Qris Fyn.jpeg"

class="qris"


>





<h2 id="instruksi">

Silahkan Scan QRIS

</h2>




<p id="status">

Menunggu transaksi...

</p>



`;
      }

      // ========================
      // FULLSCREEN
      // ========================

      function fullscreen() {
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen();
        }
      }

      // refresh setiap 2 detik

      setInterval(cekTransaksi, 2000);

      cekTransaksi();
    </script>
  </body>
</html>
